  cached_network_image: ^3.4.1
  cloud_functions: ^6.0.6
  share_plus: ^10.1.0
  promptpay_qrcode_generate: ^1.0.2
  screenshot: ^3.0.0
  flutter_cache_manager: ^3.4.1
  flutter_local_notifications: ^21.0.0
  firebase_messaging: ^16.1.1
  flutter_launcher_icons: ^0.14.4
  thai_address_picker: ^1.0.4
  flutter_riverpod: ^2.6.1
dependency_overrides:
  camera_android_camerax: 0.6.9+1
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/colae2.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/colae2.png"


